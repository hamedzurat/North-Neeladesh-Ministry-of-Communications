[workspace]
members = [
    "crates/protocol",
    "crates/backend",
    "crates/protocol-harness",
]
resolver = "2"

[workspace.package]
edition = "2024"
license = "MIT"
version = "0.1.0"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_cbor = "0.11"
thiserror = "2.0"
