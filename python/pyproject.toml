[project]
name = "north-neeladesh-voice-workers"
version = "0.1.0"
description = "Offline local voice workers for the North Neeladesh voice daemon"
requires-python = ">=3.12"
dependencies = [
    "qwen-tts",
    "torch",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
