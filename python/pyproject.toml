[project]
name = "north-neeladesh-voice-workers"
version = "0.1.0"
description = "Offline local voice workers for the North Neeladesh voice daemon"
requires-python = ">=3.12"
dependencies = [
    "qwen-tts",
    "torch",
    "huggingface-hub",
]

[project.optional-dependencies]
flash-attn = ["flash-attn>=2.8.3"]

[dependency-groups]
dev = ["ruff>=0.11"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]

[tool.uv.extra-build-dependencies]
flash-attn = ["torch"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
