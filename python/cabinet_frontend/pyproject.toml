[project]
name = "north-neeladesh-cabinet-frontend"
version = "0.1.0"
description = "Raspberry Pi Cabinet Frontend for North Neeladesh"
requires-python = ">=3.12"
dependencies = [
    "cbor2>=5.6,<6",
    "Adafruit-Blinka>=8.58",
    "adafruit-circuitpython-mcp230xx>=2.5",
    "Pillow>=11",
    "gpiozero>=2",
    "spidev>=3.6",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["hardware_frontend*"]
