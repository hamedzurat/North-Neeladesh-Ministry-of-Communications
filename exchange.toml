# Shared exchange resources. Story beats, prompts, rewards, and authored audio
# remain in the Rust story modules. Components share these subscriber records.
active_calls = 3
patience_min_seconds = 32
patience_max_seconds = 64
ring_grace_seconds = 16
shift_duration_seconds = 90
call_arrival_interval_seconds = 0
story_seed = 1

# Speech-recognition vocabulary and common Whisper substitutions.
# `private_info` on each subscriber is visible in the operator/debug display.
# It is not automatically given to callers; story rules grant it explicitly.
voice_vocabulary = [
    "Mohona Heights",
    "Shapla Apartments",
    "Neel University",
    "Shadhin Housing",
    "Meghna Abashon",
    "Padma Nibash",
    "Nusrat Rahman",
    "Prof. Kashem",
    "Arnab Bhattacharjee",
    "Bela Bose",
    "Agent Rahman",
    "Farhana",
    "Tariq",
    "Dr. Kamal",
    "Rehana",
    "Bagha News",
    "Koyal Market",
    "Secret Police",
    "Karnafuli Colony",
    "Teesta Bhaban",
    "Shonarpara Tower",
    "bKash",
]

[leds]
brightness = 30
call_wait = { red = 255, green = 255, blue = 0 } # Yellow
call_expired = { red = 255, green = 0, blue = 0 } # Red
connected_direct = { red = 255, green = 255, blue = 255 } # White
connected_operator = { red = 0, green = 255, blue = 0 } # Green
tap = { red = 0, green = 80, blue = 255 } # Blue
control = { red = 255, green = 255, blue = 255 } # White
crank = { red = 255, green = 255, blue = 255 } # White
status_wait = { red = 24, green = 24, blue = 24 } # Dark Gray (Dim)
status_record = { red = 255, green = 80, blue = 0 } # Orange
status_stt = { red = 0, green = 80, blue = 255 } # Blue
status_llm = { red = 180, green = 0, blue = 255 } # Purple
status_tts = { red = 0, green = 255, blue = 80 } # Spring Green

