# Mechanical exchange settings. Add [[subscribers]] entries for the story.
active_calls = 3
patience_min_seconds = 32
patience_max_seconds = 64
ring_grace_seconds = 16
shift_duration_seconds = 90
call_arrival_interval_seconds = 0
story_seed = 1

# Speech-recognition vocabulary and common Whisper substitutions.
# `private_info` on each subscriber is visible in the operator/debug display.
